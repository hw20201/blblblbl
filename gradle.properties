# Keep Gradle's JVM well below the 3.8 GiB workspace limit; the Kotlin compiler shares it.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 enabled for this branch's release builds (PR #6). The minified build
# previously crashed on startup, so device-test the R8 APK before merge.
nexus.r8=true
