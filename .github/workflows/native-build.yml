name: Native Build

on:
  workflow_dispatch:

# Builds the native core + bridge from repo sources and uploads the pair
# as artifacts. It never commits, releases, or tags anything; a human
# verifies the artifacts and commits them to a branch.
permissions:
  contents: read

jobs:
  build-native:
    name: Build native libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;28.2.13676358"
      - name: Build native libraries
        run: bash scripts/build-native.sh
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: |
            app/src/main/jniLibs/arm64-v8a/libclash.so
            app/src/main/jniLibs/arm64-v8a/libbridge.so
            native/SHA256SUMS
