name: Nexus Build

on:
  push:
    branches:
      - main
      - test/mips
    tags:
      - "v*"
  workflow_dispatch:

# Releases are managed manually as drafts after verification.
# CI must never create, publish, or update any Release or tag.
permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check source identity and tag version
        env:
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ "$TRIGGER_REF" == refs/tags/v* ]]; then
            test "${TRIGGER_REF#refs/tags/v}" = "$VERSION_NAME"
          fi
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify and record APK identity
        run: |
          set -euo pipefail
          mkdir -p build_output
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" build_output/Nexus-arm64-v8a-release.apk
          git rev-parse HEAD > build_output/source-commit.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > build_output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > build_output/apk-info.txt
          (cd build_output && sha256sum *.apk > SHA256SUMS)
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/detekt/
          if-no-files-found: ignore
