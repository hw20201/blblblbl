name: Nexus Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Existing source ref to build (for example refs/tags/v1.0.2)"
        required: true
        default: "main"
      source_sha:
        description: "Exact expected source commit SHA (40 hexadecimal characters)"
        required: true

# Releases are managed manually as drafts after verification.
# CI must never create, publish, or update any Release or tag.
permissions:
  contents: read

jobs:
  build:
    # Signing is dispatched from main; the immutable source ref is selected separately.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check source identity and tag version
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          TAG_NAME="${SOURCE_REF#refs/tags/}"
          if [[ "$SOURCE_REF" == refs/tags/v* || "$SOURCE_REF" == v* ]]; then
            test "${TAG_NAME#v}" = "$VERSION_NAME"
          fi
          if [[ "$TAG_NAME" == v1.0.2 ]]; then
            test "$EXPECTED_SHA" = "2459ca7cd6b91419b286c20ff71365054c71d1ac"
            test "$(git rev-parse HEAD)" = "2459ca7cd6b91419b286c20ff71365054c71d1ac"
          fi
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache
      - name: Build Release APK with fixed signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/nexus-release.jks"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          test -s "$RELEASE_STORE_FILE"
          unset RELEASE_KEYSTORE_BASE64
          ./gradlew assembleRelease --no-daemon --no-configuration-cache
      - name: Remove signing material even after failure
        if: always()
        run: rm -f "$RUNNER_TEMP/nexus-release.jks"
      - name: Verify and record APK identity
        env:
          EXPECTED_CERT_SHA256: "5818b0edbe3d38beff7aef1dc2e6b23f7da22f747b20d5a76ac62aebc6836711"
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: |
          set -euo pipefail
          mkdir -p build_output
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > build_output/signature.txt
          ACTUAL_CERT_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build_output/signature.txt)
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > build_output/apk-info.txt
          grep -q "package: name='com.github.mihomo.android'" build_output/apk-info.txt
          if [[ "${SOURCE_REF#refs/tags/}" == v1.0.2 ]]; then
            grep -q "versionCode='6' versionName='1.0.2'" build_output/apk-info.txt
          fi
          cp "$APK" build_output/Nexus-arm64-v8a-release.apk
          git rev-parse HEAD > build_output/source-commit.txt
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > build_output/workflow-commit.txt
          (cd build_output && sha256sum *.apk > SHA256SUMS)
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/detekt/
          if-no-files-found: ignore
