name: Arca v99 Nowhere

on:
  push:
    branches: [v99-nowhere-core]
  workflow_dispatch:

# Release assets are reviewed and attached manually after both jobs pass.
permissions:
  contents: read

concurrency:
  group: arca-v99-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOMAXPROCS: "4"

jobs:
  core:
    name: Pinned nw3 protocol and native regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: native/golang/go.sum
      - name: Prepare pinned and patched nw3 without changing default source
        run: bash scripts/build-native-v99.sh --prepare-only
      - name: Download and verify Rust Nowhere 3.3.0 reference
        run: |
          set -euo pipefail
          mkdir -p build_output/reference
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/nowhere.tar.gz" \
            https://github.com/NodePassProject/Nowhere/releases/download/v3.3.0/nowhere-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' 97e17ffa5f710df0f27e81739cf9acb129e1e5656096a654973b39d9be4d59ab "$RUNNER_TEMP/nowhere.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nowhere.tar.gz" -C build_output/reference
          BIN=$(find "$PWD/build_output/reference" -type f -name nowhere -print -quit)
          test -n "$BIN"
          chmod +x "$BIN"
          "$BIN" --version
          printf 'NOWHERE_TEST_BINARY=%s\n' "$BIN" >> "$GITHUB_ENV"
      - name: Race tests and Rust TCP UDP interoperability
        run: |
          set -euo pipefail
          CORE=$(find "$PWD/native/build-v99" -mindepth 1 -maxdepth 1 -type d -name 'mihomo-*' -print -quit)
          test -f "$CORE/.arca-prepared"
          cd "$CORE"
          go test -race -p=2 -json ./pkg/nowhere/... -count=1 -timeout=4m > "$GITHUB_WORKSPACE/build_output/core-protocol.jsonl"
          go test -race -p=2 -json ./adapter ./adapter/outbound ./common/convert -run Nowhere -count=1 -timeout=4m > "$GITHUB_WORKSPACE/build_output/core-adapter.jsonl"
      - name: Native TUN and subscription import regression and vet
        run: |
          set -euo pipefail
          export ARCA_TEST_ASSETS="$PWD/app/src/main/assets"
          MODFILE="$PWD/native/build-v99/native.go.mod"
          cd native/golang
          go test -race -p=2 -mod=readonly -modfile="$MODFILE" -tags 'with_gvisor cmfa' -json ./tun ./subscription -count=1 -timeout=4m > "$GITHUB_WORKSPACE/build_output/native-tun.jsonl"
          go vet -p=2 -mod=readonly -modfile="$MODFILE" -tags 'with_gvisor cmfa' ./tun ./subscription
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arca-v99-core-evidence
          path: |
            build_output/*.jsonl
            native/build-v99/core-source-*
            native/build-v99/core-patches.sha256
          if-no-files-found: warn
          retention-days: 30

  android:
    name: Signed Arca v99 ARM64 APK
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: native/golang/go.sum
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild matching v99 native pair from pinned nw3
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-native-v99.sh --abi arm64-v8a
          git diff --exit-code HEAD -- scripts/build-native.sh native/golang/go.mod native/golang/go.sum
      - name: Rebuild same-version QuickJS native libraries for 16 KiB pages
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-quickjs-v99.sh --abi arm64-v8a
      - name: Static analysis and all app unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew detekt testDebugUnitTest -Parca.quickJs16k=true --no-daemon --no-configuration-cache --max-workers=2
      - name: Build R8 Release APK with fixed release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/arca-v99-release.jks"
          trap 'test "${RELEASE_STORE_FILE:?}" = "$RUNNER_TEMP/arca-v99-release.jks" && rm -f -- "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          test -s "$RELEASE_STORE_FILE"
          unset RELEASE_KEYSTORE_BASE64
          ./gradlew assembleRelease -Pnexus.r8=true -Parca.quickJs16k=true --no-daemon --no-configuration-cache --max-workers=2
      - name: Verify signed APK, ABI, and native payloads
        run: |
          set -euo pipefail
          mkdir -p build_output/jniLibs/arm64-v8a
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > build_output/signature.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build_output/signature.txt)
          test "$ACTUAL" = e73785b2afe10e9e3181c6cc337a1da5900edf9751896e21790d4d3ddc7a1ef2
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > build_output/apk-info.txt
          grep -q "package: name='com.github.arca.android' versionCode='99' versionName='1.1.0'" build_output/apk-info.txt
          ! grep -q 'application-debuggable' build_output/apk-info.txt
          grep -q "native-code: 'arm64-v8a'" build_output/apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" > build_output/zipalign.txt
          python3 scripts/verify-apk-v99.py "$APK" build_output
          cp "$APK" build_output/Arca-v99-arm64-v8a.apk
          cp app/src/main/jniLibs/arm64-v8a/*.so build_output/jniLibs/arm64-v8a/
          cp native/SHA256SUMS build_output/native-SHA256SUMS
          cp native/build-v99/core-source-* native/build-v99/core-patches.sha256 native/build-v99/go-* build_output/
          cp native/build-v99/quickjs-android-1.4.6-16k.{aar,provenance.json,sha256} build_output/
          git rev-parse HEAD > build_output/source-commit.txt
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > build_output/workflow-commit.txt
          (cd build_output && sha256sum Arca-v99-arm64-v8a.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Arca-v99-arm64-v8a
          path: build_output/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arca-v99-app-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/detekt/
            app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 30
