name: Arca Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout debug-build source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37 build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache
      - name: Verify and record APK identity
        run: |
          set -euo pipefail
          mkdir -p build_output
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > build_output/apk-info.txt
          grep -q "package: name='com.github.arca.android.draftglass'" build_output/apk-info.txt
          cp "$APK" build_output/arca-debug.apk
          git rev-parse HEAD > build_output/source-commit.txt
          (cd build_output && sha256sum *.apk > SHA256SUMS)
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: arca-debug-apk
          path: build_output/
          if-no-files-found: error
